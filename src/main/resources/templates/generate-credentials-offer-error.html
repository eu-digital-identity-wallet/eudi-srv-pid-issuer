<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(~{::title}, ${#messages.msg('page.description.error')})}">
    <title th:text="#{eudiw} + ' :: ' + #{unable-to-generate-credentials-offer}">EU Digital Identity Wallet :: Unable to
        Generate Credentials Offer</title>
</head>
<body>
<nav th:replace="~{fragments/layout :: header}"></nav>
<main class="py-4">
    <div class="container">
        <div class="page-title mb-4">
            <i class="bi bi-x-octagon-fill text-danger fs-2" aria-hidden="true"></i>
            <h1 class="mb-0" th:text="#{unable-to-generate-credentials-offer}">Unable to Generate Credentials Offer</h1>
        </div>
        <div class="app-card card">
            <div class="card-body">
                <h2 class="h5 mb-3" th:text="#{credentials-offer-could-not-be-generated-due-to} + ':'">
                    The Credentials Offer could not be generated due to the following errors:
                </h2>
                <!--/*@thymesVar id="error" type="kotlin.String"*/-->
                <div class="alert alert-danger d-flex align-items-center gap-2" role="alert">
                    <i class="bi bi-exclamation-triangle-fill fs-4" aria-hidden="true"></i>
                    <span th:text="#{${error}}">Error</span>
                </div>
            </div>
            <div class="card-footer d-flex flex-column flex-sm-row align-items-sm-center gap-2">
                <!--/*@thymesVar id="openid4VciVersion" type="kotlin.String"*/-->
                <div class="d-flex align-items-center gap-2 text-secondary small flex-grow-1"
                     th:unless="${#strings.isEmpty(openid4VciVersion)}">
                    <i class="bi bi-info-circle" aria-hidden="true"></i>
                    <span th:text="#{openid4vci-version(${openid4VciVersion})}">OpenId4VCI Version</span>
                </div>
                <a class="btn btn-outline-primary btn-block-mobile"
                   href=""
                   th:href="@{/issuer/credentialsOffer/generate}">
                    <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>
                    <span th:text="#{go-back}">Go Back</span>
                </a>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
