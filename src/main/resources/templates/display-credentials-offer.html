<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(~{::title}, ${#messages.msg('page.description.qr')})}">
    <title th:text="#{eudiw} + ' :: ' + #{issue-credentials}">EU Digital Identity Wallet :: Issue Credentials</title>
</head>
<body>
<nav th:replace="~{fragments/layout :: header}"></nav>
<main class="py-4">
    <div class="container">
        <div class="page-title mb-4">
            <i class="bi bi-qr-code-scan text-primary fs-2" aria-hidden="true"></i>
            <h1 class="mb-0" th:text="#{issue-credentials}">Issue Credentials</h1>
        </div>
        <div class="app-card card">
            <div class="card-header">
                <h2 class="h5 mb-0" th:text="#{scan-qr-code-to-issue-credentials} + ':'">
                    Scan the generated QR Code to issue the requested Credentials:
                </h2>
            </div>
            <div class="card-body text-center">
                <!--/*@thymesVar id="qrCode" type="kotlin.String"*/-->
                <!--/*@thymesVar id="qrCodeMediaType" type="kotlin.String"*/-->
                <div class="qr-frame">
                    <img class="qr-code"
                         th:src="'data:' + ${qrCodeMediaType} + ';base64,' + ${qrCode}"
                         alt="QR Code"
                         th:alt="#{qr-code}">
                </div>
                <!--/*@thymesVar id="uri" type="kotlin.String"*/-->
                <p class="mt-4 mb-1">
                    <span th:text="#{alternatively-you-can-click}">Alternatively, you can click this</span>
                    <a rel="noopener noreferrer"
                       target="_blank"
                       href="https://netcompany-intrasoft.com"
                       th:href="${uri}">
                        <span th:text="#{link}">Link</span>
                        <i class="bi bi-box-arrow-up-right" aria-hidden="true"></i>
                    </a>
                </p>
                <p class="mb-3" th:text="#{or-copy-the-link-below}">Or copy the link below</p>
                <div class="d-flex align-items-stretch justify-content-center gap-2 flex-wrap">
                    <code class="credentials-offer-uri p-2 rounded bg-body-tertiary"
                          th:text="${uri}">https://netcompany-intrasoft.com</code>
                    <button id="copyOfferUri" type="button" class="btn btn-outline-primary"
                            th:attr="data-label=#{copy}, data-copied=#{copied}">
                        <i class="bi bi-clipboard me-1" aria-hidden="true"></i>
                        <span class="copy-button-label" th:text="#{copy}">Copy</span>
                    </button>
                </div>
                <span class="visually-hidden" role="status" aria-live="polite"></span>
            </div>
            <div class="card-footer d-flex flex-column flex-sm-row align-items-sm-center gap-2">
                <!--/*@thymesVar id="openid4VciVersion" type="kotlin.String"*/-->
                <div class="d-flex align-items-center gap-2 text-secondary small flex-grow-1"
                     th:unless="${#strings.isEmpty(openid4VciVersion)}">
                    <i class="bi bi-info-circle" aria-hidden="true"></i>
                    <span th:text="#{openid4vci-version(${openid4VciVersion})}">OpenId4VCI Version</span>
                </div>
                <a class="btn btn-outline-primary btn-block-mobile"
                   href=""
                   th:href="@{/issuer/credentialsOffer/generate}">
                    <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>
                    <span th:text="#{go-back}">Go Back</span>
                </a>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script type="application/javascript" defer th:src="@{/public/js/copy-credential-offer-uri.js}"></script>
</body>
</html>
